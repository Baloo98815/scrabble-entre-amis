# Environnement de développement local : uniquement Postgres + Adminer.
# Le serveur et le client tournent en dehors de Docker pendant le dev actif (pnpm dev:*).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrabble
      POSTGRES_PASSWORD: scrabble
      POSTGRES_DB: scrabble
    ports:
      - "5432:5432"
    volumes:
      - scrabble_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrabble -d scrabble"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  scrabble_postgres_dev:
